name: Publish UVVM

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release and UVVM submodule
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Publish to GitHub Packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Expected a release tag such as v2026.10.27, got '$RELEASE_TAG'." >&2
            exit 1
          fi
          ./gradlew --no-daemon publishUvvmPublicationToGitHubPackagesRepository \
            "-PpackageVersion=${RELEASE_TAG#v}"
